services:
  autosender:
    # Пин вместо :latest (2026-07-25). Тег перезаписывается КАЖДЫМ пушем в main
    # (см. .github/workflows/ci.yml), т.е. `compose up` мог поднять произвольную
    # новую сборку. Дайджест — то, на что `:latest` указывал на момент пина,
    # т.е. заморозка текущего рабочего образа. После следующего осознанного
    # релиза образа дайджест здесь надо обновить.
    image: ghcr.io/stufently/tdata-session-exporter:latest@sha256:c4d1b0209bae895dd236722a2e712be93a9fadbb5beb90add98210f1c1aaf896
    container_name: extractor
    volumes:
      # Монтируем директории с данными
      - ./app:/app
      - ./tdatas:/app/tdatas
      - ./sessions:/app/sessions
      - ./.env:/app/.env
    env_file:
      - .env  # Монтируем .env файл с переменными окружения
    restart: on-failure
