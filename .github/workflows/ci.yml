# .github/workflows/docker-build.yml
name: Build Docker image

on:
  push:
    branches: [ main ]        # билд только при пуше в main
  workflow_dispatch:          # возможность запустить руками

permissions:
  contents: read
  packages: write             # нужен для push в ghcr.io

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tdata-session-exporter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Third-party экшены запинены по commit-SHA (теги vN — mutable, а джоба
      # держит GHCR push-токен). Каждый SHA фиксирует указанный рядом полный тег.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
