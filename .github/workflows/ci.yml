# .github/workflows/docker-build.yml
name: Build Docker image

on:
  push:
    branches: [ main ]        # билд только при пуше в main
  workflow_dispatch:          # возможность запустить руками

permissions:
  contents: read
  packages: write             # нужен для push в ghcr.io

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tdata-session-exporter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Third-party экшены запинены по commit-SHA (теги vN — mutable, а джоба
      # держит GHCR push-токен). SHA = то, во что vN резолвились на 2026-07-25.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
